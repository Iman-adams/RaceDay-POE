name: Part 1 - Validate repository structure

# Runs on every push and every pull request
on:
  push:
  pull_request:

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      # Download the repository so the checks below can see the files
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that the docs folder exists
        run: |
          if [ ! -d docs ]; then
            echo "::error::The /docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check for the ERD image or PDF
        run: |
          if ls docs/* 2>/dev/null | grep -qiE '\.(png|jpg|jpeg|pdf)$'; then
            echo "ERD found."
          else
            echo "::error::No ERD (.png, .jpg or .pdf) found in /docs."
            exit 1
          fi

      - name: Check for the API endpoint plan
        run: |
          if ls docs/* 2>/dev/null | grep -qiE '\.(md|pdf)$'; then
            echo "Endpoint plan found."
          else
            echo "::error::No endpoint plan (.md or .pdf) found in /docs."
            exit 1
          fi

      - name: Check for the SQL script
        run: |
          if ls docs/* 2>/dev/null | grep -qiE '\.sql$'; then
            echo "SQL script found."
          else
            echo "::error::No .sql script found in /docs."
            exit 1
          fi

      - name: Check that the README exists
        run: |
          if [ ! -f README.md ]; then
            echo "::error::README.md is missing from the repository root."
            exit 1
          fi
          echo "README found."

      # Only a warning, so the build still passes before the video link is added
      - name: Check the README has a YouTube link
        run: |
          if grep -qi 'youtu' README.md; then
            echo "YouTube link found."
          else
            echo "::warning::README.md has no YouTube link yet."
          fi
